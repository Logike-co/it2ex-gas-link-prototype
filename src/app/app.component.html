<div class="flex min-h-full flex-col">
  <div
    class="leyenda-shell sticky top-0 z-50 border-b-2 border-accent bg-navy px-2 py-1 text-center text-[11px] font-extrabold tracking-widest text-white print:static sm:text-xs"
    data-testid="leyenda-demo"
    role="status"
  >
    {{ disclaimer }}
  </div>

  <header class="no-print bg-surface shadow-sm" data-testid="barra-superior">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2 px-3 py-2 md:px-4">
      <a [routerLink]="home()" class="flex shrink-0 items-center" data-testid="logo">
        <img src="gaslink-logo.png" alt="GasLink · Gestión comercial del gas" class="h-9 w-auto md:h-11" width="132" height="44" data-testid="logo-img" />
      </a>

      <div class="min-w-0 flex-1 text-xs leading-tight text-muted" data-testid="sesion-encabezado">
        @if (usuario(); as u) {
          @if (empresa(); as e) {
            <div class="truncate font-bold text-navy" data-testid="empresa-sesion">{{ e.nombre }}</div>
          }
          <div class="truncate">
            <span class="font-semibold text-ink" data-testid="usuario-sesion">{{ u.nombre }}</span>
            · <span data-testid="perfil-sesion">{{ perfil() }}</span>
          </div>
        } @else {
          <span data-testid="usuario-sesion">Sin sesión</span>
        }
      </div>

      <div class="flex w-full flex-wrap items-center gap-2 sm:w-auto">
        <label class="sr-only" for="cambio-perfil">Cambio rápido de perfil</label>
        <select
          id="cambio-perfil"
          class="input w-full min-w-0 text-xs sm:w-56"
          data-testid="cambio-perfil"
          title="Cambio rápido de perfil"
          [value]="seleccion()"
          (change)="cambiarPerfil($event)"
        >
          <option value="" [selected]="seleccion() === ''">Cambiar de perfil…</option>
          @for (g of opciones(); track g.grupo) {
            <optgroup [label]="g.grupo">
              @for (o of g.opciones; track o.value) {
                <option [value]="o.value" [selected]="o.value === seleccion()">{{ o.label }}</option>
              }
            </optgroup>
          }
        </select>
        <button
          type="button"
          class="btn"
          data-testid="btn-guia"
          title="Guía del presentador (Ctrl+Shift+D)"
          [class.btn-primary]="demo.hudOpen()"
          [attr.aria-pressed]="demo.hudOpen()"
          (click)="demo.toggleHud()"
        >
          Guía
        </button>
        <button type="button" class="btn btn-accent" data-testid="btn-reiniciar" title="Reiniciar demo (Ctrl+Shift+R)" (click)="reiniciar()">
          Reiniciar demo
        </button>
        @if (usuario()) {
          <button type="button" class="btn" data-testid="btn-salir" (click)="salir()">Salir</button>
        }
      </div>
    </div>

    @if (menu().length) {
      <nav class="border-t border-line bg-surface px-2 md:px-4" aria-label="Menú del perfil" data-testid="menu">
        <ul class="flex flex-wrap gap-1 py-1">
          @for (m of menu(); track m.view) {
            <li>
              <a
                [routerLink]="'/' + m.path"
                routerLinkActive
                #rla="routerLinkActive"
                ariaCurrentWhenActive="page"
                class="flex min-h-11 items-center rounded-lg px-3 text-sm font-semibold"
                [class]="rla.isActive ? 'bg-primary text-white' : 'text-primary hover:bg-primary-soft'"
                [attr.data-testid]="'nav-' + m.view"
                >{{ m.label }}</a
              >
            </li>
          }
        </ul>
      </nav>
    }
    <div class="brand-rule h-[3px]" aria-hidden="true"></div>
  </header>

  <div class="flex flex-1 items-start">
    <main class="min-w-0 flex-1 p-3 md:p-5">
      @if (store.flash(); as f) {
        <div
          class="no-print mb-3 flex items-center justify-between gap-2 rounded-lg border px-3 py-2 text-sm"
          [class]="f.kind === 'ok' ? 'border-success bg-success-soft text-success' : f.kind === 'warning' ? 'border-warning bg-warning-soft text-warning' : 'border-error bg-error-soft text-error'"
          data-testid="aviso"
          role="alert"
        >
          <span><app-code-text [text]="f.text" /></span>
          <button type="button" class="-my-1 min-h-11 shrink-0 px-2 text-xs underline md:min-h-0" data-testid="cerrar-aviso" (click)="store.flash.set(null)">Cerrar</button>
        </div>
      }
      <app-view-trace />
      <router-outlet />
    </main>

    <app-demo-hud />
  </div>
</div>
